name: Cross-Platform Build

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/CMakeLists.txt"
      - "**/src/**/*.cpp"
      - "**/src/**/*.hpp"
      - "**/src/**/*.h"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin libwayland-dev libxkbcommon-dev
          sudo apt-get install -y libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxi-dev
          sudo apt-get install -y libgl1-mesa-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build project
        run: cmake --build build

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++

          - os: ubuntu-latest
            compiler: clang
            cxx: clang++

          - os: windows-latest
            compiler: msvc
            cxx: cl

          - os: macos-latest
            compiler: apple-clang
            cxx: clang++
      fail-fast: false
